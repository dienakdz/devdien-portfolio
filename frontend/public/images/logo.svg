<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Dark Mode Luminous Radiant Gold -->
    <linearGradient id="zen-gold-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Light Mode High-Contrast Bronze Amber -->
    <linearGradient id="zen-gold-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="45%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <style>
      .zen-shape-stroke {
        stroke: url(#zen-gold-light);
        stroke-width: 10.5;
      }
      .zen-shape-fill {
        fill: url(#zen-gold-light);
      }
      @media (prefers-color-scheme: dark) {
        .zen-shape-stroke {
          stroke: url(#zen-gold-dark);
          stroke-width: 9;
        }
        .zen-shape-fill {
          fill: url(#zen-gold-dark);
        }
      }
    </style>
  </defs>

  <path
    class="zen-shape-stroke"
    d="M 32 16 H 50 C 72 16 86 30 86 50 C 86 70 72 84 50 84 H 32 C 24 84 18 78 18 70 V 30 C 18 22 24 16 32 16 Z"
    stroke-linejoin="round"
    fill="none"
  />
  <path
    class="zen-shape-fill"
    d="M 48 34 C 57 34 64 41 64 50 C 64 59 57 66 48 66 C 54 62 56 56 56 50 C 56 44 54 38 48 34 Z"
  />
</svg>